services:
  - type: web
    name: vietnamese-enterprise-rag-demo
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.web
    healthCheckPath: /api/health
    envVars:
      - key: WEBAPP_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BOOTSTRAP_TOKEN
        sync: false
      - key: WEBAPP_ENABLE_RERANKER
        value: "false"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash

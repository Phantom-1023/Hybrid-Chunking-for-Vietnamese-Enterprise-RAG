    <rect x="14" y="95" width="152" height="42" rx="10" fill="#203f34"/><text x="34" y="121" class="nav">✦  Hỏi đáp</text><text x="34" y="177" class="nav">▤  Tài liệu</text><text x="34" y="225" class="nav">⌘  Quản trị</text><text x="34" y="273" class="nav">◫  Nhật ký</text>
    <rect x="14" y="680" width="152" height="58" rx="11" fill="#17342b" stroke="#2a5042"/><circle cx="31" cy="710" r="5" fill="#69ce96"/><text x="44" y="706" font-family="Inter" font-weight="800" font-size="9" fill="#fff">Hệ thống sẵn sàng</text><text x="44" y="722" font-family="Inter" font-size="8" fill="#7f9a90">ACL-first retrieval</text>

    <g transform="translate(630 135)"><rect width="190" height="116" rx="16" class="white" stroke="#dfe7e3"/><text x="20" y="28" class="small">Tài liệu</text><text x="20" y="70" class="h1">128</text><text x="20" y="95" class="body">đã phân quyền</text></g>

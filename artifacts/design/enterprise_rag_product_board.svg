    <rect x="725" y="34" width="96" height="34" rx="17" class="chip"/><text x="773" y="55" class="small" text-anchor="middle">Nhân sự</text>
    <rect x="479" y="180" width="56" height="56" rx="18" class="mint"/><text x="507" y="216" text-anchor="middle" font-size="24" fill="#1a6c51">✦</text>
    <text x="507" y="295" text-anchor="middle" class="h1" style="font-size:34px">Bạn muốn tìm hiểu điều gì?</text><text x="507" y="330" text-anchor="middle" class="body">Chỉ tìm trong tài liệu bạn được phép truy cập.</text>
    <rect x="280" y="370" width="142" height="42" rx="12" class="white" stroke="#dfe7e3"/><text x="351" y="396" class="small" text-anchor="middle">Chính sách nghỉ phép ↗</text>
    <rect x="432" y="370" width="142" height="42" rx="12" class="white" stroke="#dfe7e3"/><text x="503" y="396" class="small" text-anchor="middle">Quy trình phê duyệt ↗</text>

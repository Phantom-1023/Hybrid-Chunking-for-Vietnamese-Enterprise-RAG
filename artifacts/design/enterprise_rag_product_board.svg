    <rect x="235" y="665" width="570" height="100" rx="18" class="white" stroke="#dce5e1"/><text x="258" y="704" class="body">Hỏi về tài liệu nội bộ…</text><text x="258" y="744" class="small">Chỉ dùng nguồn bạn có quyền truy cập</text><rect x="748" y="714" width="38" height="38" rx="10" class="green"/><text x="767" y="739" text-anchor="middle" font-size="19" fill="#fff">↑</text>
    <rect x="200" y="120" width="160" height="32" rx="16" fill="#15372b"/><text x="280" y="141" class="label" text-anchor="middle">03 · CHAT + CITATION</text>
  </g>


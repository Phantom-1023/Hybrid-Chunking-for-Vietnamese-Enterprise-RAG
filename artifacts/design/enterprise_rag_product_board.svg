<svg xmlns="http://www.w3.org/2000/svg" width="4800" height="1120" viewBox="0 0 4800 1120">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#071b14" flood-opacity=".18"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#70c59f"/></marker>
    <style>
      .title{font:800 42px Inter,Arial;fill:#f5fbf8}.sub{font:500 17px Inter,Arial;fill:#9cb4aa}.screen{fill:#f6f8f7;stroke:#426458;stroke-width:2}.h1{font:800 32px Inter,Arial;fill:#17211e}.h2{font:800 20px Inter,Arial;fill:#17211e}.body{font:500 13px Inter,Arial;fill:#65716c}.small{font:700 11px Inter,Arial;fill:#6f7d77}.eyebrow{font:800 10px Inter,Arial;letter-spacing:2px;fill:#28745d}.nav{font:700 12px Inter,Arial;fill:#bdcec7}.white{fill:#fff}.line{stroke:#dfe7e3;stroke-width:1}.green{fill:#185c49}.mint{fill:#e1f1dc}.chip{fill:#edf4f0}.node{fill:#17362c;stroke:#4d806d;stroke-width:2}.nodeText{font:700 14px Inter,Arial;fill:#f3faf7;text-anchor:middle}.edge{stroke:#70c59f;stroke-width:3;fill:none;marker-end:url(#arrow)}.edgeText{font:700 10px Inter,Arial;fill:#8ccfb1}.label{font:800 12px Inter,Arial;fill:#8ec4ae;letter-spacing:1.5px}
    </style>
  </defs>
  <rect width="4800" height="1120" fill="#0d201a"/>
  <text x="90" y="82" class="title">KnowledgeOS · Vietnamese Enterprise RAG</text>
  <text x="90" y="120" class="sub">Product board v0.1 · ACL-first retrieval · fine-tuned Cross-Encoder · evidence-backed administration</text>

  <!-- Architecture -->
  <g transform="translate(90 175)" filter="url(#shadow)">
    <rect width="890" height="850" rx="28" fill="#122a22" stroke="#2e5748" stroke-width="2"/>
    <text x="38" y="54" class="label">01 · SYSTEM FLOW</text>
    <text x="38" y="94" class="title" style="font-size:28px">Luồng kiểm soát truy cập</text>
    <text x="38" y="125" class="sub" style="font-size:13px">Quyền được áp dụng trước mọi bước retrieval và reranking.</text>
    <rect x="55" y="185" width="160" height="64" rx="14" class="node"/><text x="135" y="212" class="nodeText">Web client</text><text x="135" y="231" class="small" text-anchor="middle" fill="#9bb5aa">Login · Chat · Admin</text>
    <rect x="355" y="185" width="180" height="64" rx="14" class="node"/><text x="445" y="212" class="nodeText">FastAPI</text><text x="445" y="231" class="small" text-anchor="middle" fill="#9bb5aa">Session · Audit</text>
    <rect x="655" y="185" width="170" height="64" rx="14" class="node"/><text x="740" y="212" class="nodeText">Auth store</text><text x="740" y="231" class="small" text-anchor="middle" fill="#9bb5aa">User · Role · Dept</text>
    <path d="M215 217H350" class="edge"/><text x="276" y="205" class="edgeText">HTTPS</text>
    <path d="M535 217H650" class="edge"/><text x="566" y="205" class="edgeText">IDENTITY</text>

    <rect x="65" y="350" width="190" height="72" rx="14" class="node"/><text x="160" y="380" class="nodeText">Document ACL</text><text x="160" y="402" class="small" text-anchor="middle" fill="#9bb5aa">Org · Dept · Private</text>
    <rect x="355" y="350" width="180" height="72" rx="14" class="node"/><text x="445" y="380" class="nodeText">Dense + BM25</text><text x="445" y="402" class="small" text-anchor="middle" fill="#9bb5aa">Candidate top-20</text>
    <rect x="635" y="350" width="210" height="72" rx="14" class="node"/><text x="740" y="380" class="nodeText">Fine-tuned reranker</text><text x="740" y="402" class="small" text-anchor="middle" fill="#9bb5aa">Cross-Encoder</text>
    <path d="M445 249V308H160V345" class="edge"/><text x="270" y="296" class="edgeText">FILTER FIRST</text>
    <path d="M255 386H350" class="edge"/><path d="M535 386H630" class="edge"/>

    <rect x="185" y="535" width="190" height="72" rx="14" class="node"/><text x="280" y="565" class="nodeText">Top-5 evidence</text><text x="280" y="587" class="small" text-anchor="middle" fill="#9bb5aa">Passage + metadata</text>
    <rect x="515" y="535" width="190" height="72" rx="14" class="node"/><text x="610" y="565" class="nodeText">Answer + citation</text><text x="610" y="587" class="small" text-anchor="middle" fill="#9bb5aa">LLM fail-closed</text>
    <path d="M740 422V490H280V530" class="edge"/><path d="M375 571H510" class="edge"/>
    <rect x="65" y="700" width="780" height="105" rx="18" fill="#18392e" stroke="#345e4f"/>
    <text x="94" y="733" class="label">VERIFIED GATES</text>
    <text x="94" y="765" class="sub" style="font-size:13px">Locked split 913 / 114 / 114 · Fine-tuned MRR 0.945 · Hit@1 0.930</text>
    <text x="94" y="791" class="sub" style="font-size:13px">ACL cross-department denial PASS · 20 concurrent local requests 20/20</text>
  </g>

  <!-- Login -->
  <g transform="translate(1030 175)" filter="url(#shadow)">
    <rect width="860" height="850" rx="28" class="screen"/>
    <rect width="420" height="850" rx="28" fill="#eaf2ed"/><rect x="398" width="22" height="850" fill="#eaf2ed"/>
    <rect x="55" y="60" width="44" height="44" rx="13" class="green"/><text x="77" y="89" text-anchor="middle" font-family="Inter" font-weight="800" font-size="18" fill="#fff">K</text>
    <text x="55" y="165" class="h1" style="font-size:40px">Tri thức đúng người.</text><text x="55" y="215" class="h1" style="font-size:40px">Đúng quyền.</text><text x="55" y="265" class="h1" style="font-size:40px">Có dẫn nguồn.</text>
    <text x="55" y="330" class="body">Không gian hỏi đáp nội bộ với kiểm soát truy cập</text><text x="55" y="352" class="body">theo phòng ban và bằng chứng có thể kiểm tra.</text>
    <rect x="55" y="400" width="108" height="30" rx="15" class="white"/><text x="109" y="420" class="small" text-anchor="middle">ACL trước retrieval</text>
    <rect x="172" y="400" width="88" height="30" rx="15" class="white"/><text x="216" y="420" class="small" text-anchor="middle">Audit trail</text>
    <rect x="269" y="400" width="98" height="30" rx="15" class="white"/><text x="318" y="420" class="small" text-anchor="middle">Top-5 citations</text>
    <text x="485" y="140" class="eyebrow">ĐĂNG NHẬP HỆ THỐNG</text><text x="485" y="184" class="h1">Chào mừng trở lại</text><text x="485" y="216" class="body">Dùng tài khoản do quản trị viên cấp.</text>
    <text x="485" y="285" class="small">Email</text><rect x="485" y="300" width="310" height="50" rx="12" class="white" stroke="#dfe7e3"/><text x="503" y="330" class="body">ban@doanhnghiep.vn</text>
    <text x="485" y="390" class="small">Mật khẩu</text><rect x="485" y="405" width="310" height="50" rx="12" class="white" stroke="#dfe7e3"/><text x="503" y="436" class="body">••••••••••••</text>
    <rect x="485" y="485" width="310" height="52" rx="12" class="green"/><text x="640" y="517" text-anchor="middle" font-family="Inter" font-size="13" font-weight="800" fill="#fff">Đăng nhập  →</text>
    <text x="485" y="575" class="eyebrow">SECURITY NOTE</text><text x="485" y="605" class="body">Password hash · Expiring session · Audit log</text>
    <rect x="36" y="36" width="160" height="32" rx="16" fill="#15372b"/><text x="116" y="57" class="label" text-anchor="middle">02 · LOGIN</text>
  </g>

  <!-- Chat -->
  <g transform="translate(1940 175)" filter="url(#shadow)">
    <rect width="860" height="850" rx="28" class="screen"/>
    <rect width="180" height="850" rx="28" fill="#10251e"/><rect x="158" width="22" height="850" fill="#10251e"/>
